<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#241811">
<meta name="robots" content="noindex">
<title>Ester &amp; Prince · Encontre o seu lugar</title>
<meta property="og:title" content="Ester &amp; Prince · Encontre o seu lugar">
<meta property="og:description" content="Procure o seu nome e veja onde vai sentar-se. 24 de Outubro de 2026, Quinta das Buganvílias.">
<meta property="og:image" content="og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap">
<style>
/* Matches the invitation site: espresso grounds, parchment cards framed in terracotta, gold spaced capitals, Cormorant italic names, olive botanicals. */
:root{
  color-scheme:dark;
  --espresso:#241811;--espresso-2:#2d1f16;--bark:#3a281b;--terracotta:#a6592f;--terracotta-light:#c07f52;
  --parchment:#f3e9d8;--parchment-dim:#e9dcc4;--parchment-hi:#fbf5ea;--gold:#c9a66b;--sage:#54604a;--ink:#2a1e15;--muted:#6b5a47;
  --hair:rgba(201,166,107,.45);--hair-soft:rgba(201,166,107,.22);--frame:rgba(166,89,47,.35);
  --ok:#5f7a4f;--ok-soft:#e3e8d6;--bad:#9b3a24;--bad-soft:#f3dccf;--en:#4d6b70;
  --serif:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --sans:"Jost","Futura","Century Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-variant-numeric:lining-nums;background:var(--espresso);color:var(--parchment);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.num{font-variant-numeric:tabular-nums lining-nums}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes heroIn{from{transform:scale(1.08);opacity:0}to{transform:none;opacity:1}}
.eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:500}

/* language pill, as on the invitation */
.lang-toggle{position:fixed;top:max(16px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));z-index:50;display:flex;background:rgba(20,13,8,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(201,166,107,.4);border-radius:20px;overflow:hidden}
.lang-toggle button{border:0;background:transparent;color:rgba(243,233,216,.65);font-family:var(--sans);font-size:11px;letter-spacing:.1em;padding:8px 14px;cursor:pointer;transition:all .2s}
.lang-toggle button[aria-pressed="true"]{background:var(--terracotta);color:var(--parchment)}

/* hero */
.hero{position:relative;min-height:min(62svh,560px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:6vh max(16px,6vw) 6vh;overflow:hidden;background:var(--espresso)}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;filter:saturate(.92) contrast(1.02);animation:heroIn 2.4s ease-out both}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,13,8,.15) 0%,rgba(20,13,8,.3) 40%,rgba(20,13,8,.9) 86%,rgba(36,24,17,1) 100%)}
.hero-content{position:relative;z-index:2;animation:fadeUp 1.4s ease-out .4s both}
.hero .eyebrow{display:block;margin-bottom:18px}
.names{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(54px,14vw,104px);line-height:.95;margin:0;color:var(--parchment);letter-spacing:.01em}
.amp{display:block;font-size:.55em;color:var(--terracotta-light);margin:.02em 0}
.hero-date{margin-top:22px;font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--parchment-dim)}
.hero-date b{color:var(--gold);font-weight:500}
.hero-place{margin-top:8px;font-family:var(--serif);font-style:italic;font-size:19px;color:var(--parchment-dim)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;height:16px;width:16px;cursor:pointer;background:linear-gradient(45deg,transparent 45%,var(--gold) 45%,var(--gold) 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,var(--gold) 45%,var(--gold) 55%,transparent 55%)}

/* gold sprig divider */
.divider{display:flex;align-items:center;justify-content:center;gap:18px;padding:34px 6vw 6px}
.divider .line{height:1px;width:min(120px,22vw);background:linear-gradient(90deg,transparent,var(--gold))}
.divider .line.right{background:linear-gradient(90deg,var(--gold),transparent)}
.divider svg{width:30px;height:30px;opacity:.9}

/* search */
.find{max-width:560px;margin:0 auto;padding:22px max(18px,env(safe-area-inset-right)) 40px max(18px,env(safe-area-inset-left));text-align:center;display:flex;flex-direction:column;gap:16px}
.find h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(36px,10vw,50px);line-height:1.05;margin:4px 0 0;color:var(--parchment)}
.find .lede{margin:0 auto;max-width:36ch;color:var(--parchment-dim);font-size:15.5px}
.search{position:relative;margin-top:8px}
.search svg{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--gold);pointer-events:none}
.search input{width:100%;border:0;border-bottom:1px solid var(--gold);background:transparent;padding:14px 8px 14px 36px;font-family:var(--serif);font-size:24px;font-style:italic;color:var(--parchment);outline:none;border-radius:0;-webkit-appearance:none}
.search input::placeholder{color:rgba(243,233,216,.4)}
.search input:focus{border-bottom-color:var(--terracotta-light);box-shadow:0 1px 0 var(--terracotta-light)}
.results{list-style:none;margin:6px 0 0;padding:0;text-align:left;border-top:1px solid var(--hair-soft)}
.results li{border-bottom:1px solid var(--hair-soft)}
.results button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:left;border:0;background:none;padding:16px 4px;cursor:pointer;transition:background .2s,padding .2s}
.results button:hover,.results button:focus-visible{background:rgba(201,166,107,.08);padding-left:10px}
.results .nm{font-family:var(--serif);font-size:23px;font-weight:500;color:var(--parchment);line-height:1.2}
.results mark{background:none;color:var(--terracotta-light)}
.results .tb{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:6px}
.results .tb svg{width:14px;height:14px}
.hint{font-size:14px;color:rgba(243,233,216,.6);font-style:italic;margin:2px 0 0}
.empty{border:1px solid var(--hair);padding:18px;color:var(--parchment-dim);font-size:15px;text-align:center}
.empty strong{display:block;font-family:var(--serif);font-style:italic;font-size:22px;font-weight:500;color:var(--parchment);margin-bottom:4px}
.foot{text-align:center;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:rgba(201,166,107,.7);padding:26px 16px max(28px,env(safe-area-inset-bottom))}

/* seat: sage ground with a framed parchment card */
.seat-wrap{min-height:100vh;min-height:100svh;background:radial-gradient(120% 100% at 50% 0%,#445039 0%,#33402c 45%,#262e21 100%);padding:max(64px,calc(env(safe-area-inset-top) + 56px)) max(14px,env(safe-area-inset-right)) 30px max(14px,env(safe-area-inset-left));display:flex;flex-direction:column;align-items:center;gap:16px}
.back{align-self:center;width:100%;max-width:560px;border:0;background:none;color:var(--parchment-dim);font-size:11px;letter-spacing:.22em;text-transform:uppercase;padding:4px 0;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:500}
.back svg{width:16px;height:16px;color:var(--gold)}
.card{position:relative;overflow:hidden;background:var(--parchment);color:var(--ink);max-width:560px;width:100%;padding:44px 26px 34px;border-radius:2px;box-shadow:0 30px 70px rgba(0,0,0,.35);text-align:center;animation:fadeUp .7s ease both}
.card::before{content:"";position:absolute;inset:10px;border:1px solid var(--frame);pointer-events:none;z-index:2}
.card>*:not(.bot){position:relative;z-index:1}
.bot{position:absolute;width:min(46%,200px);height:auto;pointer-events:none;z-index:0;opacity:.55}
.bot-tr{top:-34px;right:-44px}
.bot-bl{bottom:-34px;left:-44px;transform:rotate(180deg)}
.card .lbl{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--terracotta);font-weight:500}
.card .big{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(56px,16vw,78px);line-height:1;color:var(--bark);margin:6px 0 10px}
.card .who{font-size:14.5px;color:var(--muted);line-height:1.6;max-width:34ch;margin:0 auto}
.card .who b{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink);font-style:italic}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;padding:6px 12px;border:1px solid var(--hair);color:var(--bark);border-radius:20px}
.chip svg{width:13px;height:13px;color:var(--terracotta)}
.chip.en{border-color:rgba(77,107,112,.5);color:var(--en)}
.sprig-div{display:flex;align-items:center;justify-content:center;gap:14px;margin:22px auto 18px;max-width:300px}
.sprig-div span{display:block;height:1px;flex:1;background:rgba(201,166,107,.65)}
.sprig-div .sprig{width:28px;height:auto;flex:none}
.map{margin:0 -8px;border:1px solid var(--hair);background:var(--parchment-hi);padding:4px;border-radius:2px}
.map svg{display:block;width:100%;height:auto}
.map-cap{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:13.5px;color:var(--muted);font-style:italic}
.map-cap svg{width:18px;height:18px;color:var(--terracotta);flex:none}
.checkin{display:flex;flex-direction:column;gap:12px;align-items:center}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 30px;border:1.5px solid var(--gold);background:transparent;color:var(--bark);font-family:var(--sans);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;cursor:pointer;text-decoration:none;transition:background .25s,border-color .25s,color .25s;border-radius:0}
.btn svg{width:16px;height:16px;flex:none}
.btn:hover{background:var(--terracotta);border-color:var(--terracotta);color:#fff}
.btn.primary{background:var(--terracotta);border-color:var(--terracotta);color:var(--parchment);width:100%;max-width:360px;padding:18px 24px;font-size:13px}
.btn.primary:hover{background:#8f4b26;border-color:#8f4b26}
.btn:disabled{opacity:.6;cursor:default}
.ci-note{font-size:13px;color:var(--muted);font-style:italic;margin:0}
.done{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 2px}
.done .rings{width:58px;height:36px;color:var(--terracotta);margin-bottom:6px}
.done h3{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(38px,11vw,50px);line-height:1;margin:0;color:var(--bark)}
.done p{margin:6px 0 0;color:var(--muted);font-size:14.5px}
.done small{display:block;margin-top:6px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--terracotta);font-weight:500}
.err{background:var(--bad-soft);color:var(--bad);padding:12px 14px;font-size:14px;max-width:360px}
.notme{border:0;background:none;color:var(--parchment-dim);font-size:13px;font-style:italic;text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:4px;cursor:pointer;padding:4px}
.seat-wrap .foot{padding-top:6px}

/* room drawing (parchment) */
.r-floor{fill:var(--parchment-hi);stroke:var(--bark);stroke-width:5}
.r-pista{fill:rgba(84,96,74,.13)}
.r-pista-t{font-family:var(--serif);font-style:italic;font-size:108px;fill:rgba(84,96,74,.32);text-anchor:middle;dominant-baseline:middle;letter-spacing:.12em}
.r-fix{fill:#efe3cf;stroke:rgba(166,89,47,.3)}
.r-fix-t{font-size:18px;fill:#8a7660;text-anchor:middle;dominant-baseline:middle;font-family:var(--sans);font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.r-entry-t{fill:var(--terracotta);font-size:20px}
.r-door{fill:var(--parchment-hi)}
.r-top{fill:var(--parchment);stroke:var(--gold);stroke-width:1.5}
.r-top-s{stroke:var(--parchment)}
.r-edge{stroke:var(--gold)}
.r-ch{fill:var(--parchment-hi);stroke:rgba(201,166,107,.9);stroke-width:1.4}
.r-ch.on{fill:var(--ok);stroke:var(--ok)}
.r-name{font-variant-numeric:lining-nums;font-family:var(--serif);font-size:27px;font-weight:600;fill:var(--bark);text-anchor:middle;paint-order:stroke;stroke:var(--parchment-hi);stroke-width:6px}
.r-cnt{font-family:var(--sans);font-size:17px;font-weight:500;fill:#8a7660;text-anchor:middle;letter-spacing:.04em;paint-order:stroke;stroke:var(--parchment-hi);stroke-width:4px}
.r-t.dim{opacity:.42}
.r-t.focus .r-top{fill:var(--terracotta);stroke:var(--bark);stroke-width:2.5}
.r-t.focus .r-top-s{stroke:var(--terracotta)}
.r-t.focus .r-edge{stroke:var(--bark);stroke-width:44}
.r-t.focus .r-ch{fill:var(--parchment);stroke:var(--terracotta);stroke-width:2}
.r-t.focus .r-name{font-size:42px;font-style:italic;fill:var(--terracotta);stroke-width:9px}
.r-ring{fill:none;stroke:var(--terracotta);stroke-width:3.5;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
.r-ring2{animation-delay:1.2s}
@keyframes ring{0%{transform:scale(.72);opacity:.85}100%{transform:scale(1.25);opacity:0}}
.r-route-bg{stroke:var(--parchment-hi);stroke-width:22;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.r-route{stroke:var(--terracotta);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 20;animation:walk 1.1s linear infinite}
@keyframes walk{to{stroke-dashoffset:-22}}
.r-arrowhead{fill:var(--terracotta)}
.r-you circle{fill:var(--terracotta);opacity:.22}
.r-you .r-you-dot{fill:var(--terracotta);opacity:1}
.r-lang{fill:#e2ebe7;stroke:var(--en);stroke-width:1}
.r-lang-t{font-family:var(--sans);font-size:15px;font-weight:600;fill:var(--en);text-anchor:middle;letter-spacing:.1em}
.r-alc rect{stroke-width:1}
.r-alc.yes rect{fill:#f3e3d6;stroke:var(--terracotta)}.r-alc.yes path{stroke:var(--terracotta)}
.r-alc.no rect{fill:#efe3cf;stroke:rgba(166,89,47,.3)}.r-alc.no path{stroke:#8a7660}
.r-t.lv0 .r-top{fill:var(--parchment-hi)}.r-t.lv0 .r-top-s{stroke:var(--parchment-hi)}
.r-t.lv1 .r-top{fill:#e8ead9}.r-t.lv1 .r-top-s{stroke:#e8ead9}
.r-t.lv2 .r-top{fill:#c8d2b2}.r-t.lv2 .r-top-s{stroke:#c8d2b2}
.r-t.lv3 .r-top{fill:#97a882}.r-t.lv3 .r-top-s{stroke:#97a882}
.r-t[data-tid]{cursor:pointer}
.r-t.sel .r-top{stroke:var(--terracotta);stroke-width:5}.r-t.sel .r-edge{stroke:var(--terracotta);stroke-width:46}
@media (prefers-reduced-motion:reduce){.r-ring,.r-route,.hero-img,.hero-content,.card{animation:none}.r-route{stroke-dasharray:none}}

/* ===== reception ===== */
.rec{max-width:1280px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
.pin-wrap{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(120% 100% at 50% 0%,#445039 0%,#33402c 45%,#262e21 100%)}
.pin{max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px;align-items:center}
.pin h1{font-family:var(--serif);font-style:italic;font-weight:500;font-size:44px;line-height:1;margin:0;color:var(--bark)}
.pin p{margin:0;color:var(--muted)}
.pin input{width:100%;text-align:center;font-size:30px;letter-spacing:.5em;border:0;border-bottom:1px solid var(--gold);background:transparent;padding:10px;color:var(--ink);font-family:var(--serif);outline:none}
.r-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-top:4px}
.r-head h1{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(40px,6vw,56px);line-height:1;margin:6px 0 0}
.live{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--parchment-dim);font-weight:500}
.live i{width:9px;height:9px;border-radius:50%;background:#7d6a56}
.live.on i{background:#9db27f;box-shadow:0 0 0 4px rgba(157,178,127,.2)}
.live.warn i{background:var(--terracotta-light)}
.stats{display:flex;flex-wrap:wrap;gap:12px 34px;align-items:center;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:16px 2px}
.stat b{display:block;font-family:var(--serif);font-size:40px;font-weight:500;line-height:1;color:var(--parchment)}
.stat span{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:500}
.bar{flex:1 1 220px;display:flex;flex-direction:column;gap:7px;min-width:180px}
.bar div{height:6px;background:rgba(243,233,216,.12);border-radius:99px;overflow:hidden}
.bar div i{display:block;height:100%;background:linear-gradient(90deg,var(--terracotta),var(--gold));border-radius:99px;transition:width .4s}
.bar small{font-size:13px;color:var(--parchment-dim)}
.banner{background:var(--bad-soft);color:var(--bad);padding:12px 14px;font-weight:500;font-size:14px}
.banner code{background:#fff;padding:1px 5px;font-size:13px;color:var(--ink)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--hair-soft)}
.tabs button{border:0;background:none;padding:10px 14px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:rgba(243,233,216,.6);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--parchment);border-bottom-color:var(--terracotta-light)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools input{flex:1 1 240px;border:0;border-bottom:1px solid var(--gold);background:transparent;padding:10px 4px;font-size:18px;font-family:var(--serif);font-style:italic;color:var(--parchment);min-width:0;outline:none;border-radius:0}
.tools input::placeholder{color:rgba(243,233,216,.4)}
.seg{display:inline-flex;border:1px solid rgba(201,166,107,.4);border-radius:20px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 13px;font-size:11px;letter-spacing:.1em;color:rgba(243,233,216,.7);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--terracotta);color:var(--parchment)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;align-items:start}
.tcard{position:relative;background:var(--parchment);color:var(--ink);padding:16px 16px 10px;display:flex;flex-direction:column;gap:8px;min-width:0;border-radius:2px}
.tcard::before{content:"";position:absolute;inset:6px;border:1px solid var(--frame);pointer-events:none}
.tcard>*{position:relative}
.tcard.full::before{border-color:rgba(95,122,79,.6)}
.tcard h3{margin:0;font-family:var(--serif);font-style:italic;font-weight:500;font-size:26px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--bark)}
.tcard h3 span{font-family:var(--sans);font-style:normal;font-size:12px;letter-spacing:.1em;font-weight:500;color:var(--terracotta)}
.tcard.full h3 span{color:var(--ok)}
.tcard .chips{justify-content:flex-start;margin:0}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:7px 4px;border-top:1px solid var(--hair-soft);min-width:0}
.panel-pop .row{border-top-color:rgba(201,166,107,.18)}
.row .nm{flex:1;min-width:0;font-family:var(--serif);font-size:18.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{font-family:var(--sans);font-size:11px;font-weight:500;color:var(--terracotta);margin-left:5px}
.row .tm{font-size:11px;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.tick{appearance:none;width:34px;height:34px;flex:none;border-radius:50%;border:1.5px solid var(--gold);background:transparent;cursor:pointer;display:grid;place-items:center;color:transparent;transition:all .2s}
.tick svg{width:16px;height:16px}
.tick:hover{border-color:var(--ok);color:rgba(95,122,79,.5)}
.row.in .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.row.in .nm{color:var(--ok)}
.row.confirm{background:var(--bad-soft)}
.undo{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--bad);font-weight:500}
.undo button{border:1px solid var(--bad);background:#fff;color:var(--bad);padding:4px 9px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.undo button.keep{border-color:var(--gold);color:var(--ink)}
.panel-pop{position:relative;background:var(--parchment);color:var(--ink);padding:10px 16px;border-radius:2px}
.panel-pop .row .tm{color:var(--muted)}
.r-map{background:var(--parchment);padding:8px;overflow-x:auto;border-radius:2px}
.r-map svg{display:block;width:100%;min-width:680px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--parchment-dim);padding:2px}
.legend i{display:inline-block;width:16px;height:11px;border:1px solid var(--gold);margin-right:6px;vertical-align:-1px}
.qr-box{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;background:var(--parchment);color:var(--ink);padding:26px;border-radius:2px}
.qr-box::before{content:"";position:absolute;inset:10px;border:1px solid var(--frame);pointer-events:none}
.qr-box>*:not(.bot){position:relative;z-index:1}
.qr-box h3{margin:0;font-family:var(--serif);font-style:italic;font-weight:500;font-size:32px;color:var(--bark)}
.qr-box p{color:var(--muted);margin:6px 0}
.qr-box canvas,.qr-box img{width:220px;height:220px;image-rendering:pixelated;background:#fff}
.qr-box .url{word-break:break-all;font-size:13.5px;background:var(--parchment-hi);border:1px solid var(--hair);padding:8px 10px;margin:10px 0 14px}
.qr-box .acts{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:600px){.qr-box{grid-template-columns:1fr;justify-items:center;text-align:center}.qr-box .acts{justify-content:center}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));background:rgba(20,13,8,.88);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(201,166,107,.45);color:var(--parchment);padding:10px 18px;border-radius:20px;font-size:13px;letter-spacing:.04em;z-index:60;max-width:calc(100vw - 32px)}

/* printable sign: parchment card with botanicals */
.sign{display:none}
@media print{
  @page{size:A5 portrait;margin:0}
  body{background:var(--parchment)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #app>*:not(.sign),.lang-toggle,.toast{display:none!important}
  .sign{display:flex!important;position:relative;overflow:hidden;flex-direction:column;align-items:center;justify-content:center;gap:5mm;width:148mm;height:209mm;text-align:center;color:var(--ink);background:var(--parchment)}
  .sign::before{content:"";position:absolute;inset:7mm;border:.6pt solid rgba(166,89,47,.45)}
  .sign .bot{width:62mm;opacity:.6}
  .sign .bot-tr{top:-10mm;right:-12mm}.sign .bot-bl{bottom:-10mm;left:-12mm}
  .sign .s1{font-family:var(--sans);font-size:8.5pt;letter-spacing:.32em;text-transform:uppercase;color:var(--terracotta);font-weight:500}
  .sign .s2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:36pt;line-height:1;color:var(--bark)}
  .sign .s3{font-family:var(--serif);font-style:italic;font-size:18pt;color:var(--terracotta)}
  .sign img{width:72mm;height:72mm;image-rendering:pixelated;margin:2mm 0}
  .sign .s4{font-family:var(--sans);font-size:9pt;color:var(--muted);letter-spacing:.06em}
  .sign .s5{font-family:var(--serif);font-style:italic;font-size:15pt;color:var(--bark)}
}

.fx-box{fill:#efe3cf;stroke:rgba(166,89,47,.3)}
.fx-t{font-size:18px;fill:#8a7660;text-anchor:middle;dominant-baseline:middle;font-family:var(--sans);font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.fx-dance{fill:rgba(84,96,74,.13)}
.fx-dance-t{font-family:var(--serif);font-style:italic;text-transform:uppercase;fill:rgba(84,96,74,.32);text-anchor:middle;dominant-baseline:middle;letter-spacing:.12em}
.fx-deck{fill:none;stroke:rgba(166,89,47,.35);stroke-width:2}

    if(!p){if(merge){Object.keys(m.data||{}).forEach(function(k){if(m.data[k]==null)delete R.ci[k];else R.ci[k]=m.data[k]})}else R.ci=m.data||{}}
    else{var k=p.split("/")[0];if(p.indexOf("/")<0){if(m.data==null)delete R.ci[k];else R.ci[k]=merge?Object.assign({},R.ci[k]||{},m.data):m.data}else{R.ci[k]=R.ci[k]||{};R.ci[k][p.split("/")[1]]=m.data}}
    R.live="on";R.err=null;renderRec()};
  es.addEventListener("put",function(e){apply(e,false)});es.addEventListener("patch",function(e){apply(e,true)});
  es.addEventListener("cancel",function(){R.err=401;R.live="off";renderRec();es.close()});
  es.onopen=function(){R.live="on";renderLive()};es.onerror=function(){R.live="warn";renderLive()};
}
function poll(){FB.get("").then(function(v){R.ci=v||{};R.live="on";R.err=null;renderRec()}).catch(function(){R.live="warn";renderLive()})}
function renderLive(){var l=$("#live");if(l){l.className="live "+(R.live==="on"?"on":R.live==="warn"?"warn":"");l.innerHTML='<i></i>'+(R.live==="on"?"Ao vivo":R.live==="warn"?"A religar…":"Offline")}}
function renderRec(){
  var ppl=0,inP=0,inv=G.length,inI=0;G.forEach(function(g){ppl+=sz(g);if(arrived(g)){inP+=sz(g);inI++}});
  var pct=ppl?Math.round(inP/ppl*100):0;
  if(!$("#recbody")){
    app.innerHTML='<div class="rec"><div class="r-head"><div><div class="eyebrow">Recepção · Quinta das Buganvílias</div><h1>Chegadas</h1></div><span class="live" id="live"></span></div>'+
      '<div id="banner"></div><section class="stats" id="stats"></section>'+
      '<div class="tabs" role="tablist"><button role="tab" data-tab="tables">Por mesa</button><button role="tab" data-tab="az">Lista A–Z</button><button role="tab" data-tab="map">Mapa</button><button role="tab" data-tab="qr">QR code &amp; PDF</button></div>'+
      '<div class="tools" id="tools"><input id="rq" type="search" placeholder="Procurar convidado ou mesa" autocomplete="off"><span class="seg" role="group" aria-label="Mostrar"><button data-show="all">Todos</button><button data-show="in">Chegaram</button><button data-show="out">Por chegar</button></span></div>'+
      '<div id="recbody"></div></div>'+signHTML();
  }
  $("#stats").innerHTML='<div class="stat"><b class="num">'+inP+'</b><span>Pessoas chegaram</span></div><div class="stat"><b class="num">'+(ppl-inP)+'</b><span>Por chegar</span></div><div class="stat"><b class="num">'+inI+'/'+inv+'</b><span>Convites</span></div><div class="bar"><div><i style="width:'+pct+'%"></i></div><small>'+pct+'% dos '+ppl+' convidados</small></div>';
  $("#banner").innerHTML=R.err?'<div class="banner">'+(R.err===401||R.err===403?'A base de dados do Firebase está a recusar os check-ins. Adicione a regra <code>checkins</code> nas regras da Realtime Database (ver instruções que a Ester recebeu).':'Sem ligação à internet. Os check-ins aparecem quando a ligação voltar.')+'</div>':'';
  document.querySelectorAll("[data-tab]").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.tab===R.tab))});
  document.querySelectorAll("[data-show]").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.show===R.show))});
  $("#tools").hidden=R.tab==="qr";
  renderLive();renderRecBody();
}
function filtered(){var q=norm(R.q).trim();return G.filter(function(g){if(R.show==="in"&&!arrived(g))return false;if(R.show==="out"&&arrived(g))return false;if(!q)return true;return norm(g.name).indexOf(q)>=0||norm(TB[g.tableId].name).indexOf(q)>=0||norm(shortName(TB[g.tableId]))===q})}
function rowHTML(g,withTable){var c=R.ci[g.id],cf=R.confirm===g.id;
  return '<li class="row'+(c?" in":"")+(cf?" confirm":"")+'" data-row="'+esc(g.id)+'"><button class="tick" data-tick="'+esc(g.id)+'" aria-label="'+(c?"Desfazer check-in de ":"Fazer check-in de ")+esc(g.name)+'" aria-pressed="'+!!c+'">'+ICON.check+'</button>'+
    '<span class="nm">'+esc(g.name)+(sz(g)>1?'<small>×'+sz(g)+'</small>':'')+'</span>'+
    (cf?'<span class="undo">Desfazer? <button data-undo="'+esc(g.id)+'">Sim</button><button class="keep" data-keep="1">Não</button></span>':'<span class="tm">'+(withTable?esc(shortName(TB[g.tableId])==="Honra"?"Honra":TB[g.tableId].name)+(c?" · ":""):"")+(c?hhmm(c.at)+(c.by==="staff"?" ✎":""):"")+'</span>')+'</li>'}
function renderRecBody(){
  var b=$("#recbody");if(!b)return;
  if(R.tab==="qr"){renderQR(b);return}
  var list=filtered();
  if(R.tab==="az"){list=list.slice().sort(function(a,c){return a.name.localeCompare(c.name,"pt")});b.innerHTML=list.length?'<div class="panel-pop"><ul class="rows">'+list.map(function(g){return rowHTML(g,true)}).join("")+'</ul></div>':'<div class="empty">Ninguém corresponde.</div>';return}
  if(R.tab==="map"){
    var lvl=function(t){var all=G.filter(function(g){return g.tableId===t.id}),n=0,p=0;all.forEach(function(g){p+=sz(g);if(arrived(g))n+=sz(g)});var r=p?n/p:0;return r===0?"lv0":r<.5?"lv1":r<1?"lv2":"lv3"};
    var cnt=function(t){var n=0,p=0;G.forEach(function(g){if(g.tableId===t.id){p+=sz(g);if(arrived(g))n+=sz(g)}});return n+"/"+p};
    var on=function(t){var n=0;G.forEach(function(g){if(g.tableId===t.id&&arrived(g))n+=sz(g)});return n};
    var sel=R.sel&&TB[R.sel];
    b.innerHTML='<div class="r-map">'+roomSVG(T,{lang:S.lang,fill:function(t){return lvl(t)+(R.sel===t.id?" sel":"")},counts:cnt,chairsOn:on,tags:true,idAttr:true,labels:"all"})+'</div>'+
      '<div class="legend"><span><i style="background:#FFFDF9"></i>Ninguém chegou</span><span><i style="background:#E9F0E2"></i>Menos de metade</span><span><i style="background:#C9DDBE"></i>Mais de metade</span><span><i style="background:#9FC48F"></i>Mesa completa</span><span>Toque numa mesa para ver os nomes</span></div>'+
      (sel?'<div class="grid" style="margin-top:12px">'+tableCard(sel,G.filter(function(g){return g.tableId===sel.id}))+'</div>':'');return}
  var by={};list.forEach(function(g){(by[g.tableId]=by[g.tableId]||[]).push(g)});
  var ts=DATA.tables.slice().sort(function(a,c){return (a.order||0)-(c.order||0)}).filter(function(t){return by[t.id]});
  b.innerHTML=ts.length?'<div class="grid">'+ts.map(function(t){return tableCard(t,by[t.id])}).join("")+'</div>':'<div class="empty">Ninguém corresponde.</div>';
}
function tableCard(t,list){var all=G.filter(function(g){return g.tableId===t.id}),p=0,n=0;all.forEach(function(g){p+=sz(g);if(arrived(g))n+=sz(g)});
  var tags=(isEN(t)?'<span class="chip en">English</span>':'')+(t.alcohol==="yes"?'<span class="chip">'+ICON.glass+'Com álcool</span>':t.alcohol==="no"?'<span class="chip">'+ICON.noglass+'Sem álcool</span>':'');
  return '<article class="tcard'+(p&&n===p?" full":"")+'"><h3>'+esc(t.name)+'<span class="num">'+n+'/'+p+'</span></h3>'+(tags?'<div class="chips">'+tags+'</div>':'')+'<ul class="rows">'+list.map(function(g){return rowHTML(g,false)}).join("")+'</ul></article>'}
function onRecClick(e){
  var x;
  if((x=e.target.closest("[data-tab]"))){R.tab=x.dataset.tab;R.confirm=null;renderRec();return}
  if((x=e.target.closest("[data-show]"))){R.show=x.dataset.show;renderRec();return}
  if((x=e.target.closest("[data-keep]"))){R.confirm=null;renderRecBody();return}
  if((x=e.target.closest("[data-undo]"))){var gid=x.dataset.undo,prev=R.ci[gid];R.confirm=null;delete R.ci[gid];renderRec();FB.del(gid).catch(function(){R.ci[gid]=prev;renderRec();toast("Não foi possível desfazer. Verifique a ligação.")});return}
  if((x=e.target.closest("[data-tick]"))){var id=x.dataset.tick;if(R.ci[id]){R.confirm=id;renderRecBody();return}
    R.ci[id]={at:Date.now(),by:"staff"};renderRec();FB.put(id,"staff").catch(function(err){delete R.ci[id];renderRec();toast(err&&(err.status===401||err.status===403)?"O Firebase recusou o check-in. Veja as regras.":"Sem ligação. Tente outra vez.")});return}
  if((x=e.target.closest(".r-t[data-tid]"))){R.sel=R.sel===x.dataset.tid?null:x.dataset.tid;renderRecBody();return}
  if((x=e.target.closest("[data-act='print']"))){window.print();return}
}
function guestURL(){return location.origin+location.pathname}
function signHTML(){return '<div class="sign">'+corners()+'<div class="s1">Ester &amp; Prince · 24 · 10 · 2026</div><div class="s2">Encontre o<br>seu lugar</div><div class="s3">Find your seat</div><img id="signqr" alt=""><div class="s4">Aponte a câmara do telemóvel<br>Scan with your phone camera</div><div class="s5">Quinta das Buganvílias</div></div>'}
function loadQR(cb){if(window.qrcode)return cb();var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";s.onload=cb;s.onerror=function(){cb(true)};document.head.appendChild(s)}
function renderQR(b){
  var url=guestURL();
  b.innerHTML='<div class="qr-box">'+corners()+'<div id="qrimg" style="width:220px;height:220px;display:grid;place-items:center;color:var(--muted)">A gerar…</div><div><div class="lbl" style="font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--terracotta);font-weight:500">Para os convidados</div><h3>QR code</h3><p class="lede">Os convidados apontam a câmara, procuram o nome e veem a mesa. Este é o endereço da página:</p><div class="url">'+esc(url)+'</div>'+
    '<div class="acts"><a class="btn" id="qrdl" download="qr-encontre-o-seu-lugar.png">Descarregar QR (PNG)</a><button class="btn" data-act="print">Imprimir cartaz</button><a class="btn" href="'+esc(PDF_FILE)+'" target="_blank" rel="noopener">Mapa de lugares (PDF)</a></div></div></div>';
  loadQR(function(fail){var box=$("#qrimg");if(!box)return;if(fail){box.textContent="Sem internet para gerar o QR.";return}
    var q=qrcode(0,"M");q.addData(url);q.make();var n=q.getModuleCount(),cell=Math.floor(1200/(n+8)),size=cell*(n+8),c=document.createElement("canvas");c.width=c.height=size;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,size,size);x.fillStyle="#2a1e15";
    for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+4)*cell,(r+4)*cell,cell,cell);
    var png=c.toDataURL("image/png");box.innerHTML='<img src="'+png+'" alt="QR code: '+esc(url)+'" width="220" height="220">';$("#qrdl").href=png;var si=$("#signqr");if(si)si.src=png});
}

/* ===== start ===== */
if(/^#?recepcao$/i.test(location.hash.replace(/^#/,"")))receptionView();else guestView();
});
</script>
